<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

{% include scripts.html %}

    <div style="clear: both; width: 100%; padding-top: 50px; padding-bottom: 30px; text-align: center;">
        <hr style="width: 80%; border: 0; border-top: 1px solid #eee; margin: 20px auto;">
        
        <p style="color: #777; font-size: 0.9rem; margin-bottom: 10px;">
            Total Views: <strong>1.3k+</strong> | Visitor Map
        </p>

        <div style="display: inline-block; width: 100%; max-width: 600px;"> <script type='text/javascript' id='mapmyvisitors' src='https://mapmyvisitors.com/map.js?cl=ffffff&w=600&t=n&d=b1hNM27zH8TBNM5E2VCaMs8El9H25pn4k2JcGP8rHN4&co=2d78ad&cmo=3acc3a&cmn=ff5353&ct=ffffff'></script>
        </div>
    </div>

</html>
